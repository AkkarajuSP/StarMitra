# local dev — database from docker-compose or local PostgreSQL
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/starmitra}
    username: ${DB_USER:starmitra}
    password: ${DB_PASSWORD:starmitra}
app:
  auth:
    cookie:
      secure: false
logging:
  level:
    com.starmitra: DEBUG
