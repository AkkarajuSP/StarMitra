openapi: 3.0.3
info:
  title: StarMitra API
  version: 1.0.0
  description: >-
    Canonical REST contract for StarMitra (ADR-007). Module-owned namespaces under
    /api/v1; DTO-only boundaries; RFC 9457 Problem Details; cursor/keyset
    pagination for streams, offset for bounded admin lists; database-enforced
    idempotency + Idempotency-Key header for retry-sensitive commands.
    Authentication per ADR-006: OTP + short-lived JWT (web httpOnly cookie,
    mobile Bearer) + opaque persisted refresh token.
servers:
  - url: /api/v1

tags:
  - {name: Auth, description: M01 Authentication & Identity}
  - {name: Profile, description: M02 User Profile}
  - {name: Skills, description: M03 Talent Skills}
  - {name: Media, description: M04 Media Management}
  - {name: Discovery, description: M05 Discovery / Search / Feed}
  - {name: Connect, description: M06 StarMitra Connect / Messaging}
  - {name: Rooms, description: M07 Creative Rooms}
  - {name: Portfolio, description: M08 Portfolio}
  - {name: Competitions, description: M09 Competitions}
  - {name: Submissions, description: M10 Submissions}
  - {name: Voting, description: M11 Audience Voting}
  - {name: Judges, description: M12 Judge Management}
  - {name: Rubrics, description: M13 Judge Rubrics}
  - {name: Scoring, description: M14 Scoring & Ranking}
  - {name: Progression, description: M15 Round Progression}
  - {name: Leaderboards, description: M16 Leaderboards}
  - {name: Notifications, description: M17 Notifications}
  - {name: Moderation, description: M18 Moderation}
  - {name: Admin, description: M19 Admin Portal (orchestration only)}
  - {name: JudgePortal, description: M20 Judge Portal (orchestration only)}
  - {name: Social, description: M21 Social Engagement}

paths:
  # ---------------- M01 Auth ----------------
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Initiate OTP authentication (enumeration-safe)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OtpRequest'}}}}
      responses: {'202': {description: Accepted}, default: {$ref: '#/components/responses/Problem'}}
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify OTP; issue access JWT + opaque refresh token
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OtpVerify'}}}}
      responses: {'200': {description: Session established, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate refresh token; reuse detection revokes family
      security: []
      responses: {'200': {description: Rotated session, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke current session/refresh token
      responses: {'204': {description: Revoked}, default: {$ref: '#/components/responses/Problem'}}
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List own active sessions
      responses: {'200': {description: Sessions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SessionInfo'}}}}}, default: {$ref: '#/components/responses/Problem'}}
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke a session (ownership-scoped)
      parameters: [{$ref: '#/components/parameters/IdPath'}]
      responses: {'204': {description: Revoked}, default: {$ref: '#/components/responses/Problem'}}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current identity + system roles
      responses: {'200': {description: Identity, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M02 Profile ----------------
  /profiles/me:
    get: {tags: [Profile], operationId: getMyProfile, summary: Own profile, responses: {'200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}, default: {$ref: '#/components/responses/Problem'}}}
    put:
      tags: [Profile]
      operationId: updateMyProfile
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdate'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /profiles/{userId}:
    get:
      tags: [Profile]
      operationId: getPublicProfile
      summary: Public profile view (visibility + block/moderation filtered)
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePublic'}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M03 Skills ----------------
  /skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: Active talent-skill taxonomy (cursor)
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Skills, content: {application/json: {schema: {$ref: '#/components/schemas/SkillPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create taxonomy skill (admin)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SkillCreate'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /skills/{skillId}:
    put:
      tags: [Skills]
      operationId: updateSkill
      parameters: [{name: skillId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SkillCreate'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /skills/{skillId}/deactivate:
    post:
      tags: [Skills]
      operationId: deactivateSkill
      summary: Deactivate (never delete-in-place per taxonomy lifecycle)
      parameters: [{name: skillId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Deactivated}, default: {$ref: '#/components/responses/Problem'}}
  /users/me/skills:
    get: {tags: [Skills], operationId: getMySkills, summary: Own skill associations, responses: {'200': {description: Associations, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/UserSkill'}}}}}, default: {$ref: '#/components/responses/Problem'}}}
  /users/me/skills/{skillId}:
    put:
      tags: [Skills]
      operationId: addMySkill
      parameters: [{name: skillId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/UserSkillUpdate'}}}}
      responses: {'200': {description: Associated, content: {application/json: {schema: {$ref: '#/components/schemas/UserSkill'}}}}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Skills]
      operationId: removeMySkill
      parameters: [{name: skillId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Removed}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M04 Media (ADR-008 direct-upload flow) ----------------
  /media:
    post:
      tags: [Media]
      operationId: createMediaAsset
      summary: Create media metadata record
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MediaCreate'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /media/{mediaId}/upload-url:
    post:
      tags: [Media]
      operationId: getUploadUrl
      summary: Pre-signed direct-to-storage upload URL (provider-neutral)
      parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Upload URL, content: {application/json: {schema: {$ref: '#/components/schemas/UploadUrl'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /media/{mediaId}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Mark upload complete; triggers async processing
      parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/MediaComplete'}}}}
      responses: {'200': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMediaStatus
      summary: Asset metadata + 4D state (upload/processing/moderation/visibility)
      parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /media/{mediaId}/delivery-url:
    get:
      tags: [Media]
      operationId: getDeliveryUrl
      summary: Authorized signed delivery URL (visibility + domain rules enforced)
      parameters: [{name: mediaId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Signed URL, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryUrl'}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M05 Discovery ----------------
  /search:
    get:
      tags: [Discovery]
      operationId: search
      summary: PostgreSQL FTS search (authz-scoped, visibility-filtered)
      parameters: [{name: q, in: query, required: true, schema: {type: string}}, {name: type, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Results, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /discovery:
    get:
      tags: [Discovery]
      operationId: discover
      summary: Browse-by-skill/category surface
      parameters: [{name: skillId, in: query, schema: {type: string, format: uuid}}, {name: category, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Items, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /feed:
    get:
      tags: [Discovery]
      operationId: getFeed
      summary: Personalized feed (follow/skill/engagement signals — cursor)
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Feed, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPage'}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M06 Connect ----------------
  /conversations:
    get:
      tags: [Connect]
      operationId: listConversations
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Conversations, content: {application/json: {schema: {$ref: '#/components/schemas/ConversationPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Connect]
      operationId: createConversation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConversationCreate'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Conversation'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /conversations/{conversationId}:
    get:
      tags: [Connect]
      operationId: getConversation
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Conversation, content: {application/json: {schema: {$ref: '#/components/schemas/Conversation'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /conversations/{conversationId}/messages:
    get:
      tags: [Connect]
      operationId: listMessages
      summary: History + reconnect recovery (cursor on (conversation_id, sequence))
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: since, in: query, schema: {type: integer, format: int64}}]
      responses: {'200': {description: Messages, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePage'}}}}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Connect]
      operationId: sendMessage
      summary: Persisted send (server assigns id+sequence; clientMessageId dedup)
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MessageSend'}}}}
      responses: {'201': {description: Sent, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /conversations/{conversationId}/read:
    post:
      tags: [Connect]
      operationId: markRead
      summary: Read receipts (idempotent)
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReadMark'}}}}
      responses: {'204': {description: Marked}, default: {$ref: '#/components/responses/Problem'}}
  /users/me/blocks/{userId}:
    put:
      tags: [Connect]
      operationId: blockUser
      summary: User-initiated block (M06 UserBlock — not moderation)
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'204': {description: Blocked}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Connect]
      operationId: unblockUser
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Unblocked}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M07 Creative Rooms ----------------
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: skillId, in: query, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Rooms, content: {application/json: {schema: {$ref: '#/components/schemas/RoomPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Rooms]
      operationId: createRoom
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoomCreate'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}:
    get:
      tags: [Rooms]
      operationId: getRoom
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      responses: {'200': {description: Room, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}, default: {$ref: '#/components/responses/Problem'}}
    put:
      tags: [Rooms]
      operationId: updateRoom
      parameters: [{$ref: '#/components/parameters/RoomPath'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoomCreate'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/members:
    get:
      tags: [Rooms]
      operationId: listRoomMembers
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      responses: {'200': {description: Members, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectMember'}}}}}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/required-skills/{skillId}:
    put:
      tags: [Rooms]
      operationId: addRequiredSkill
      parameters: [{$ref: '#/components/parameters/RoomPath'}, {name: skillId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Added}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Rooms]
      operationId: removeRequiredSkill
      parameters: [{$ref: '#/components/parameters/RoomPath'}, {name: skillId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Removed}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/invitations:
    post:
      tags: [Rooms]
      operationId: inviteToRoom
      parameters: [{$ref: '#/components/parameters/RoomPath'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InviteCreate'}}}}
      responses: {'201': {description: Invited, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /invitations/me:
    get:
      tags: [Rooms]
      operationId: myInvitations
      responses: {'200': {description: Invitations, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Invitation'}}}}}, default: {$ref: '#/components/responses/Problem'}}
  /invitations/{invitationId}/respond:
    post:
      tags: [Rooms]
      operationId: respondToInvitation
      summary: Explicit transition — accept/decline
      parameters: [{name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InviteResponse'}}}}
      responses: {'200': {description: Responded, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/contributions:
    post:
      tags: [Rooms]
      operationId: assignContributionRole
      summary: Contextual ProjectContributionRole (never TalentSkill/permission)
      parameters: [{$ref: '#/components/parameters/RoomPath'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContributionAssign'}}}}
      responses: {'201': {description: Assigned, content: {application/json: {schema: {$ref: '#/components/schemas/Contribution'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/tasks:
    get:
      tags: [Rooms]
      operationId: listRoomTasks
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      responses: {'200': {description: Tasks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RoomTask'}}}}}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Rooms]
      operationId: createRoomTask
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskCreate'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RoomTask'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/assets:
    post:
      tags: [Rooms]
      operationId: linkRoomAsset
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLink'}}}}
      responses: {'201': {description: Linked}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/final-outputs:
    post:
      tags: [Rooms]
      operationId: addFinalOutput
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLink'}}}}
      responses: {'201': {description: Finalized output}, default: {$ref: '#/components/responses/Problem'}}
  /rooms/{roomId}/credits:
    get:
      tags: [Rooms]
      operationId: listProjectCredits
      parameters: [{$ref: '#/components/parameters/RoomPath'}]
      responses: {'200': {description: Verified credits, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Contribution'}}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M08 Portfolio ----------------
  /portfolios/me:
    get: {tags: [Portfolio], operationId: getMyPortfolio, summary: Own portfolio (one per user — DB-04), responses: {'200': {description: Portfolio, content: {application/json: {schema: {$ref: '#/components/schemas/Portfolio'}}}}, default: {$ref: '#/components/responses/Problem'}}}
    put:
      tags: [Portfolio]
      operationId: updateMyPortfolio
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioUpdate'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Portfolio'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /portfolios/me/items:
    get: {tags: [Portfolio], operationId: listPortfolioItems, responses: {'200': {description: Items, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PortfolioItem'}}}}}, default: {$ref: '#/components/responses/Problem'}}}
    post:
      tags: [Portfolio]
      operationId: createPortfolioItem
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioItemCreate'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioItem'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /portfolios/me/items/{itemId}:
    put:
      tags: [Portfolio]
      operationId: updatePortfolioItem
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioItemCreate'}}}}
      responses: {'200': {description: Updated}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Portfolio]
      operationId: deletePortfolioItem
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Removed}, default: {$ref: '#/components/responses/Problem'}}
  /portfolios/me/items/{itemId}/media:
    post:
      tags: [Portfolio]
      operationId: linkPortfolioMedia
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLink'}}}}
      responses: {'201': {description: Linked}, default: {$ref: '#/components/responses/Problem'}}
  /portfolios/me/items/{itemId}/contributions:
    post:
      tags: [Portfolio]
      operationId: linkProjectCredit
      summary: Link verified M07 ProjectCredit — never manufactures contribution
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreditLink'}}}}
      responses: {'201': {description: Linked}, default: {$ref: '#/components/responses/Problem'}}
  /portfolios/{userId}:
    get:
      tags: [Portfolio]
      operationId: getPublicPortfolio
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Public portfolio, content: {application/json: {schema: {$ref: '#/components/schemas/Portfolio'}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M09 Competitions ----------------
  /competitions:
    get:
      tags: [Competitions]
      operationId: listCompetitions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: status, in: query, schema: {type: string}}]
      responses: {'200': {description: Competitions, content: {application/json: {schema: {$ref: '#/components/schemas/CompetitionPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
    post:
