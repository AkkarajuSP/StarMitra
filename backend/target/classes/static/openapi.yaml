      responses: {'201': {description: Decided}, default: {$ref: '#/components/responses/Problem'}}
  /moderation/restrictions:
    post:
      tags: [Moderation]
      operationId: createRestriction
      summary: Admin-enforced restriction (≠ M06 UserBlock)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RestrictionCreate'}}}}
      responses: {'201': {description: Restricted}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M19 Admin (orchestration — domain commands only) ----------------
  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: adminDashboard
      summary: Operational dashboard view (Admin/SuperAdmin; derived, never business truth)
      responses: {'200': {description: Dashboard, content: {application/json: {schema: {type: object}}}}, default: {$ref: '#/components/responses/Problem'}}
  /admin/audit:
    get:
      tags: [Admin]
      operationId: adminAuditSearch
      summary: Platform AuditLog search view (kernel read-contract)
      parameters: [{name: module, in: query, schema: {type: string}}, {name: actorId, in: query, schema: {type: string, format: uuid}}, {name: correlationId, in: query, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Audit entries, content: {application/json: {schema: {type: object}}}}, default: {$ref: '#/components/responses/Problem'}}

  # ---------------- M21 Social ----------------
  /social/follows/{userId}:
    put:
      tags: [Social]
      operationId: followUser
      summary: Follow (user→user; idempotent)
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'204': {description: Following}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Social]
      operationId: unfollowUser
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Unfollowed}, default: {$ref: '#/components/responses/Problem'}}
  /social/follows/me:
    get:
      tags: [Social]
      operationId: myFollows
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Follows, content: {application/json: {schema: {$ref: '#/components/schemas/FollowPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /social/likes:
    post:
      tags: [Social]
      operationId: likeTarget
      summary: Like MEDIA|PORTFOLIO (idempotent; ≠ competition Vote)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LikeCreate'}}}}
      responses: {'201': {description: Liked}, default: {$ref: '#/components/responses/Problem'}}
  /social/likes/{likeId}:
    delete:
      tags: [Social]
      operationId: unlike
      parameters: [{name: likeId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Unliked}, default: {$ref: '#/components/responses/Problem'}}
  /social/comments:
    post:
      tags: [Social]
      operationId: createComment
      summary: Comment on MEDIA|PORTFOLIO (create+delete only — DB-05)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentCreate'}}}}
      responses: {'201': {description: Commented, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}, default: {$ref: '#/components/responses/Problem'}}
    get:
      tags: [Social]
      operationId: listComments
      parameters: [{name: targetType, in: query, required: true, schema: {type: string, enum: [MEDIA, PORTFOLIO]}}, {name: targetId, in: query, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Comments, content: {application/json: {schema: {$ref: '#/components/schemas/CommentPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /social/comments/{commentId}:
    delete:
      tags: [Social]
      operationId: deleteComment
      parameters: [{name: commentId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Removed}, default: {$ref: '#/components/responses/Problem'}}
  /social/engagement:
    get:
      tags: [Social]
      operationId: getEngagement
      summary: Derived counts (never authoritative for business outcomes)
      parameters: [{name: targetType, in: query, required: true, schema: {type: string, enum: [MEDIA, PORTFOLIO]}}, {name: targetId, in: query, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Counts, content: {application/json: {schema: {$ref: '#/components/schemas/EngagementCounts'}}}}, default: {$ref: '#/components/responses/Problem'}}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}              # mobile
    cookieAuth: {type: apiKey, in: cookie, name: sm_access}                  # web httpOnly+SameSite + CSRF token
  security: [{bearerAuth: []}, {cookieAuth: []}]

  parameters:
    IdPath:        {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    RoomPath:      {name: roomId, in: path, required: true, schema: {type: string, format: uuid}}
    CompPath:      {name: competitionId, in: path, required: true, schema: {type: string, format: uuid}}
    SubPath:       {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor:        {name: cursor, in: query, schema: {type: string}, description: Opaque keyset cursor}
    Limit:         {name: limit, in: query, schema: {type: integer, default: 20, maximum: 100}}
    Offset:        {name: offset, in: query, schema: {type: integer, default: 0}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}, description: Required for retry-sensitive commands; DB-enforced}
    IfMatch:       {name: If-Match, in: header, required: false, schema: {type: string}, description: Optimistic concurrency (entity version)}

  responses:
    Problem:
      description: RFC 9457 Problem Details
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}

  schemas:
    ProblemDetails:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        errors: {type: array, items: {type: object}}
      required: [type, title, status]
    PageMeta:
      type: object
      properties: {nextCursor: {type: string}, hasMore: {type: boolean}, total: {type: integer}}

    # ---- auth ----
    OtpRequest:   {type: object, properties: {identifier: {type: string}, channel: {type: string, enum: [EMAIL, SMS]}}, required: [identifier, channel]}
    OtpVerify:    {type: object, properties: {identifier: {type: string}, otp: {type: string}, clientMsgId: {type: string}}, required: [identifier, otp]}
    AuthSession:  {type: object, properties: {accessToken: {type: string}, expiresIn: {type: integer}, user: {$ref: '#/components/schemas/CurrentUser'}}}
    SessionInfo:  {type: object, properties: {id: {type: string, format: uuid}, createdAt: {type: string, format: date-time}, current: {type: boolean}}}
    CurrentUser:  {type: object, properties: {id: {type: string, format: uuid}, email: {type: string}, status: {type: string}, systemRoles: {type: array, items: {type: string}}}}

    # ---- profile/skills ----
    Profile:        {type: object, properties: {userId: {type: string, format: uuid}, displayName: {type: string}, bio: {type: string}, location: {type: string}, avatarMediaId: {type: string, format: uuid}, visibilityState: {type: string}, skills: {type: array, items: {$ref: '#/components/schemas/UserSkill'}}}}
    ProfilePublic:  {type: object, properties: {userId: {type: string, format: uuid}, displayName: {type: string}, bio: {type: string}, avatarMediaId: {type: string, format: uuid}, skills: {type: array, items: {$ref: '#/components/schemas/UserSkill'}}}}
    ProfileUpdate:  {type: object, properties: {displayName: {type: string}, bio: {type: string}, location: {type: string}, avatarMediaId: {type: string, format: uuid}, visibilityState: {type: string}}}
    Skill:          {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, status: {type: string}, parentSkillId: {type: string, format: uuid}}}
    SkillCreate:    {type: object, properties: {name: {type: string}, description: {type: string}, parentSkillId: {type: string, format: uuid}}, required: [name]}
    SkillPage:      {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Skill'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    UserSkill:      {type: object, properties: {skillId: {type: string, format: uuid}, name: {type: string}, proficiency: {type: string}}}
    UserSkillUpdate: {type: object, properties: {proficiency: {type: string}}}

    # ---- media ----
    MediaCreate:    {type: object, properties: {mediaType: {type: string}, mimeType: {type: string}, sizeBytes: {type: integer, format: int64}, filename: {type: string}, visibility: {type: string, enum: [PUBLIC, FOLLOWERS, COLLABORATION_ONLY, PRIVATE]}}, required: [mediaType, mimeType]}
    MediaAsset:     {type: object, properties: {id: {type: string, format: uuid}, objectKey: {type: string}, mediaType: {type: string}, uploadState: {type: string}, processingState: {type: string}, moderationState: {type: string}, visibility: {type: string}, checksum: {type: string}}}
    MediaComplete:  {type: object, properties: {checksum: {type: string}, sizeBytes: {type: integer, format: int64}}}
    UploadUrl:      {type: object, properties: {url: {type: string, format: uri}, expiresAt: {type: string, format: date-time}, method: {type: string}}}
    DeliveryUrl:    {type: object, properties: {url: {type: string, format: uri}, expiresAt: {type: string, format: date-time}, variant: {type: string}}}

    # ---- discovery ----
    SearchPage:     {type: object, properties: {items: {type: array, items: {type: object}}, page: {$ref: '#/components/schemas/PageMeta'}}}

    # ---- connect ----
    Conversation:      {type: object, properties: {id: {type: string, format: uuid}, type: {type: string, enum: [ONE_TO_ONE, GROUP, PROJECT]}, projectId: {type: string, format: uuid}, status: {type: string}}}
    ConversationCreate: {type: object, properties: {type: {type: string}, participantIds: {type: array, items: {type: string, format: uuid}}, projectId: {type: string, format: uuid}}, required: [type]}
    ConversationPage:  {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    Message:           {type: object, properties: {id: {type: string, format: uuid}, conversationId: {type: string, format: uuid}, senderId: {type: string, format: uuid}, sequence: {type: integer, format: int64}, body: {type: string}, sentAt: {type: string, format: date-time}, clientMessageId: {type: string}}}
    MessageSend:       {type: object, properties: {body: {type: string}, clientMessageId: {type: string}, attachmentMediaIds: {type: array, items: {type: string, format: uuid}}}, required: [clientMessageId]}
    MessagePage:       {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Message'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    ReadMark:          {type: object, properties: {upToSequence: {type: integer, format: int64}}, required: [upToSequence]}

    # ---- rooms ----
    Room:               {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, status: {type: string}, visibility: {type: string}, ownerId: {type: string, format: uuid}, version: {type: integer}}}
    RoomCreate:         {type: object, properties: {name: {type: string}, description: {type: string}, visibility: {type: string}}, required: [name]}
    RoomPage:           {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Room'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    ProjectMember:      {type: object, properties: {userId: {type: string, format: uuid}, status: {type: string}, joinedAt: {type: string, format: date-time}, contributionRoles: {type: array, items: {type: string}}}}
    InviteCreate:       {type: object, properties: {inviteeId: {type: string, format: uuid}}, required: [inviteeId]}
    InviteResponse:     {type: object, properties: {action: {type: string, enum: [ACCEPT, DECLINE]}}, required: [action]}
    Invitation:         {type: object, properties: {id: {type: string, format: uuid}, roomId: {type: string, format: uuid}, status: {type: string}, expiresAt: {type: string, format: date-time}}}
    ContributionAssign: {type: object, properties: {memberUserId: {type: string, format: uuid}, roleName: {type: string}}, required: [memberUserId, roleName]}
    Contribution:       {type: object, properties: {id: {type: string, format: uuid}, userId: {type: string, format: uuid}, roleName: {type: string}, verified: {type: boolean}}}
    TaskCreate:         {type: object, properties: {title: {type: string}, description: {type: string}, assigneeMemberId: {type: string, format: uuid}, dueDate: {type: string, format: date}}, required: [title]}
    RoomTask:           {type: object, properties: {id: {type: string, format: uuid}, title: {type: string}, status: {type: string}, assigneeMemberId: {type: string, format: uuid}}}
    AssetLink:          {type: object, properties: {mediaId: {type: string, format: uuid}, role: {type: string}, sortOrder: {type: integer}}, required: [mediaId]}
    CreditLink:         {type: object, properties: {projectCreditId: {type: string, format: uuid}}, required: [projectCreditId]}

    # ---- portfolio ----
    Portfolio:           {type: object, properties: {id: {type: string, format: uuid}, userId: {type: string, format: uuid}, title: {type: string}, status: {type: string}, items: {type: array, items: {$ref: '#/components/schemas/PortfolioItem'}}}}
    PortfolioUpdate:     {type: object, properties: {title: {type: string}}}
    PortfolioItem:       {type: object, properties: {id: {type: string, format: uuid}, title: {type: string}, description: {type: string}, skillId: {type: string, format: uuid}, visibility: {type: string}, mediaIds: {type: array, items: {type: string, format: uuid}}}}
    PortfolioItemCreate: {type: object, properties: {title: {type: string}, description: {type: string}, skillId: {type: string, format: uuid}, visibility: {type: string}}, required: [title]}

    # ---- competitions ----
    Competition:          {type: object, properties: {id: {type: string, format: uuid}, title: {type: string}, configStatus: {type: string}, participationStatus: {type: string}, roundState: {type: string}, version: {type: integer}}}
    CompetitionCreate:    {type: object, properties: {title: {type: string}, description: {type: string}}, required: [title]}
    CompetitionPage:      {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Competition'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    Category:             {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}
    CategoryCreate:       {type: object, properties: {name: {type: string}, description: {type: string}, skillIds: {type: array, items: {type: string, format: uuid}}}, required: [name]}
    Round:                {type: object, properties: {id: {type: string, format: uuid}, sequence: {type: integer}, name: {type: string}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, voteConfigId: {type: string, format: uuid}, rubricVersionId: {type: string, format: uuid}}}
    RoundCreate:          {type: object, properties: {sequence: {type: integer}, name: {type: string}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, voteConfigId: {type: string, format: uuid}, rubricVersionId: {type: string, format: uuid}, progressionConfigId: {type: string, format: uuid}}, required: [sequence]}
    EligibilityRuleCreate: {type: object, properties: {ruleType: {type: string}, ruleParams: {type: object}}, required: [ruleType]}
    SubmissionConfig:     {type: object, properties: {config: {type: object}}, required: [config]}
    Participant:          {type: object, properties: {id: {type: string, format: uuid}, participantType: {type: string, enum: [USER, PROJECT]}, userId: {type: string, format: uuid}, projectId: {type: string, format: uuid}, status: {type: string}}}
    ParticipantRegister:  {type: object, properties: {participantType: {type: string, enum: [USER, PROJECT]}, categoryId: {type: string, format: uuid}, projectId: {type: string, format: uuid}}, required: [participantType]}
    ParticipantPage:      {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Participant'}}, page: {$ref: '#/components/schemas/PageMeta'}}}

    # ---- submissions ----
    Submission:        {type: object, properties: {id: {type: string, format: uuid}, participantId: {type: string, format: uuid}, competitionId: {type: string, format: uuid}, roundId: {type: string, format: uuid}, state: {type: string}, submittedAt: {type: string, format: date-time}, finalizedAt: {type: string, format: date-time}}}
    SubmissionCreate:  {type: object, properties: {participantId: {type: string, format: uuid}, roundId: {type: string, format: uuid}}, required: [participantId, roundId]}
    SubmissionPage:    {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Submission'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    ContributorDeclare: {type: object, properties: {contributors: {type: array, items: {type: object, properties: {memberRef: {type: string, format: uuid}, roleRef: {type: string, format: uuid}}}}}}

    # ---- voting ----
    VoteCast:      {type: object, properties: {submissionId: {type: string, format: uuid}, clientMsgId: {type: string}}, required: [submissionId, clientMsgId]}
    Vote:          {type: object, properties: {id: {type: string, format: uuid}, submissionId: {type: string, format: uuid}, targetType: {type: string}, castAt: {type: string, format: date-time}}}
    VoteCount:     {type: object, properties: {submissionId: {type: string, format: uuid}, count: {type: integer, format: int64}, derived: {type: boolean, default: true}}}
    VoteConfigCreate: {type: object, properties: {seriesKey: {type: string}, payload: {type: object}}, required: [seriesKey, payload]}

    # ---- judges ----
    Judge:            {type: object, properties: {id: {type: string, format: uuid}, userId: {type: string, format: uuid}, status: {type: string}}}
    JudgeCreate:      {type: object, properties: {userId: {type: string, format: uuid}}, required: [userId]}
    JudgePage:        {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Judge'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    Expertise:        {type: object, properties: {skillId: {type: string, format: uuid}, domainLabel: {type: string}, verified: {type: boolean}}}
    Assignment:       {type: object, properties: {id: {type: string, format: uuid}, judgeId: {type: string, format: uuid}, competitionId: {type: string, format: uuid}, categoryId: {type: string, format: uuid}, roundId: {type: string, format: uuid}, status: {type: string}}}
    AssignmentCreate: {type: object, properties: {competitionId: {type: string, format: uuid}, categoryId: {type: string, format: uuid}, roundId: {type: string, format: uuid}}, required: [competitionId]}

    # ---- rubrics/evaluations ----
    Rubric:            {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, status: {type: string}}}
    TemplateCreate:    {type: object, properties: {name: {type: string}, criteria: {type: array, items: {type: object, properties: {name: {type: string}, description: {type: string}, weight: {type: number}, maxScore: {type: number}}}}}, required: [name]}
    RubricPage:        {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Rubric'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    RubricVersion:     {type: object, properties: {id: {type: string, format: uuid}, templateId: {type: string, format: uuid}, versionNo: {type: integer}, status: {type: string}, criteria: {type: array, items: {type: object}}}}
    Evaluation:        {type: object, properties: {id: {type: string, format: uuid}, judgeId: {type: string, format: uuid}, submissionId: {type: string, format: uuid}, rubricVersionId: {type: string, format: uuid}, status: {type: string}, submittedAt: {type: string, format: date-time}}}
    EvaluationSubmit:  {type: object, properties: {submissionId: {type: string, format: uuid}, rubricVersionId: {type: string, format: uuid}, scores: {type: array, items: {type: object, properties: {criterionId: {type: string, format: uuid}, score: {type: number}, comment: {type: string}}}, minItems: 1}}, required: [submissionId, rubricVersionId, scores]}

    # ---- scoring/progression/leaderboard ----
    ScoringConfigCreate: {type: object, properties: {competitionId: {type: string, format: uuid}, weightAudience: {type: number}, weightJudge: {type: number}}, required: [competitionId, weightAudience, weightJudge]}
    ConfigCreate:       {type: object, properties: {competitionId: {type: string, format: uuid}, payload: {type: object}}, required: [competitionId, payload]}
    ScoringTrigger:     {type: object, properties: {competitionId: {type: string, format: uuid}, roundId: {type: string, format: uuid}, configVersionId: {type: string, format: uuid}}, required: [competitionId, roundId]}
    ResultPage:         {type: object, properties: {items: {type: array, items: {type: object}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    OverrideCreate:     {type: object, properties: {targetId: {type: string, format: uuid}, afterValue: {type: number}, reason: {type: string}}, required: [targetId, afterValue, reason]}
    ProgressionPage:    {type: object, properties: {items: {type: array, items: {type: object}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    LeaderboardPage:    {type: object, properties: {items: {type: array, items: {type: object, properties: {rank: {type: integer}, entryRef: {type: string, format: uuid}, display: {type: object}}}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    PublicationCreate:  {type: object, properties: {competitionId: {type: string, format: uuid}, categoryId: {type: string, format: uuid}, roundId: {type: string, format: uuid}, action: {type: string, enum: [PUBLISH, HIDE, ARCHIVE]}}, required: [competitionId, action]}

    # ---- notifications/moderation/social ----
    NotificationPage:  {type: object, properties: {items: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, type: {type: string}, body: {type: string}, deepLink: {type: string}, state: {type: string}, createdAt: {type: string, format: date-time}}}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    NotificationPref:  {type: object, properties: {type: {type: string}, channel: {type: string}, enabled: {type: boolean}}}
    ReportCreate:      {type: object, properties: {targetType: {type: string}, targetId: {type: string, format: uuid}, reasonCode: {type: string}, detail: {type: string}}, required: [targetType, targetId, reasonCode]}
    Report:            {type: object, properties: {id: {type: string, format: uuid}, status: {type: string}}}
    ModerationCase:    {type: object, properties: {id: {type: string, format: uuid}, status: {type: string}, assignedModeratorId: {type: string, format: uuid}}}
    CasePage:          {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ModerationCase'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    DecisionCreate:    {type: object, properties: {decisionType: {type: string}, reason: {type: string}, policyVersionId: {type: string, format: uuid}, actions: {type: array, items: {type: object}}}, required: [decisionType, reason]}
    RestrictionCreate: {type: object, properties: {targetType: {type: string}, targetId: {type: string, format: uuid}, restrictionType: {type: string}, expiresAt: {type: string, format: date-time}}, required: [targetType, targetId, restrictionType]}
    FollowPage:        {type: object, properties: {items: {type: array, items: {type: object, properties: {userId: {type: string, format: uuid}, followedAt: {type: string, format: date-time}}}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    LikeCreate:        {type: object, properties: {targetType: {type: string, enum: [MEDIA, PORTFOLIO]}, targetId: {type: string, format: uuid}}, required: [targetType, targetId]}
    CommentCreate:     {type: object, properties: {targetType: {type: string, enum: [MEDIA, PORTFOLIO]}, targetId: {type: string, format: uuid}, body: {type: string}}, required: [targetType, targetId, body]}
    Comment:           {type: object, properties: {id: {type: string, format: uuid}, authorId: {type: string, format: uuid}, body: {type: string}, createdAt: {type: string, format: date-time}}}
    CommentPage:       {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Comment'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    EngagementCounts:  {type: object, properties: {followCount: {type: integer, format: int64}, likeCount: {type: integer, format: int64}, commentCount: {type: integer, format: int64}, derived: {type: boolean, default: true}}}
