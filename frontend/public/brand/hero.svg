<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Talent stage illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#022179"/>
      <stop offset="1" stop-color="#5B3FD3"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".55">
      <stop offset="0" stop-color="#F5B942" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="400" fill="url(#bg)"/>
  <ellipse cx="240" cy="150" rx="180" ry="130" fill="url(#glow)"/>
  <!-- spotlight beams -->
  <path d="M60 0 200 360 130 360 0 40z" fill="#E9E5FF" opacity=".07"/>
  <path d="M420 0 280 360 350 360 480 40z" fill="#E9E5FF" opacity=".07"/>
  <!-- stage platform -->
  <ellipse cx="240" cy="345" rx="190" ry="26" fill="#101828" opacity=".45"/>
  <!-- rising stars -->
  <g fill="#F5B942">
    <path d="M240 96l9.4 22.7 24.6 2.2-18.5 16.4 5.6 24.1-21.1-12.2-21.1 12.2 5.6-24.1-18.5-16.4 24.6-2.2z"/>
    <path d="M120 160l6 14.5 15.7 1.4-11.8 10.4 3.6 15.3-13.5-7.8-13.5 7.8 3.6-15.3-11.8-10.4 15.7-1.4z" opacity=".85"/>
    <path d="M360 160l6 14.5 15.7 1.4-11.8 10.4 3.6 15.3-13.5-7.8-13.5 7.8 3.6-15.3-11.8-10.4 15.7-1.4z" opacity=".85"/>
  </g>
  <g fill="#E9E5FF" opacity=".8">
    <circle cx="90" cy="80" r="3"/><circle cx="160" cy="50" r="2.4"/>
    <circle cx="330" cy="60" r="2.6"/><circle cx="405" cy="110" r="3.2"/>
    <circle cx="55" cy="210" r="2.4"/><circle cx="430" cy="230" r="2.6"/>
  </g>
  <!-- performer silhouettes (abstract) -->
  <g fill="#101828" opacity=".55">
    <circle cx="240" cy="255" r="20"/>
    <path d="M215 340c0-34 11-52 25-52s25 18 25 52z"/>
  </g>
  <g fill="#7C3AED" opacity=".75">
    <circle cx="170" cy="272" r="15"/>
    <path d="M151 340c0-27 9-41 19-41s19 14 19 41z"/>
    <circle cx="310" cy="272" r="15"/>
    <path d="M291 340c0-27 9-41 19-41s19 14 19 41z"/>
  </g>
</svg>
